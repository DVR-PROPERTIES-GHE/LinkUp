<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp Feed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

.feed{
    width:100%;
    max-width:900px;
    margin:auto;
}

.post{
    background:#ececec;
    border:1px solid #bdbdbd;
    margin-bottom:12px;
    padding:16px;
    width:100%;
    min-height:120px;
    height:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    word-wrap:break-word;
    overflow-wrap:break-word;
}

.post-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    width:100%;
}

.author{
    font-size:16px;
    font-weight:700;
    color:#000;
    text-align:left;
}

.date{
    font-size:14px;
    color:#777;
    white-space:nowrap;
}

.title{
    font-size:18px;
    font-weight:700;
    color:#000;
    line-height:1.3;
    text-align:left;
    width:100%;
}

.content{
    font-size:15px;
    color:#222;
    line-height:1.6;
    text-align:left;
    width:100%;
    white-space:pre-wrap;
}

.loading,
.error{
    text-align:center;
    color:#666;
    padding:30px;
}

@media (max-width:600px){

    body{
        padding:10px;
    }

    .post{
        padding:12px;
    }

    .title{
        font-size:16px;
    }

    .content{
        font-size:14px;
    }

    .date{
        font-size:12px;
    }
}
</style>
</head>
<body>

<div class="feed" id="feed">
    <div class="loading">Loading posts...</div>
</div>

<script>
const POSTS_URL =
"https://raw.githubusercontent.com/DVR-PROPERTIES-GHE/linkupPost/refs/heads/main/posts.json";

async function loadPosts() {

    const feed = document.getElementById("feed");

    try {

        const response = await fetch(POSTS_URL);

        if (!response.ok) {
            throw new Error("Unable to load posts");
        }

        const posts = await response.json();

        feed.innerHTML = "";

        posts.forEach(post => {

            const postElement = document.createElement("div");
            postElement.className = "post";

            postElement.innerHTML = `
                <div class="post-header">
                    <div class="author">
                        ${post.Author || "Unknown Author"}
                    </div>

                    <div class="date">
                        ${post.Date || ""}
                    </div>
                </div>

                <div class="title">
                    ${post.Title || ""}
                </div>

                <div class="content">
                    ${post.Content || ""}
                </div>
            `;

            feed.appendChild(postElement);
        });

    } catch (error) {

        console.error(error);

        feed.innerHTML = `
            <div class="error">
                Failed to load posts.
            </div>
        `;
    }
}

loadPosts();

/* Automatically refresh every 30 seconds */
setInterval(loadPosts, 30000);
</script>

</body>
</html>
